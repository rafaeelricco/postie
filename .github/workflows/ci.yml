name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to verify
        required: false
        type: string

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    name: Lint, tests and coverage
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1" # the toolchain the Dockerfile ships with
      # cover runs the same race-enabled ./... suite as `make test`, plus the 90% floor.
      - run: make lint cover

  integration:
    runs-on: ubuntu-latest
    name: Integration stack
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1" # the toolchain the Dockerfile ships with
      # tests/integration/harness_test.go starts and tears down its own compose project.
      - run: make integration

  image:
    runs-on: ubuntu-latest
    name: Image builds
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
