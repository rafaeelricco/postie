name: Release

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: postie-release
  cancel-in-progress: false
  queue: max # copied from job-kit-ai so back-to-back merges all release

jobs:
  verify:
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - id: version
        name: Choose the next version
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          # A re-run reuses the tag already on this commit instead of bumping twice.
          tag=$(git tag --points-at "$SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -z "$tag" ]; then
            latest=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
            if [ -z "$latest" ]; then
              tag=v0.1.0
            else
              IFS=. read -r major minor patch <<<"${latest#v}"
              case " $LABELS " in
                *" release:major "*) tag="v$((major + 1)).0.0" ;;
                *" release:minor "*) tag="v${major}.$((minor + 1)).0" ;;
                *) tag="v${major}.${minor}.$((patch + 1))" ;;
              esac
            fi
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      # Before the push, so a failed push re-runs onto this tag (see above) and a
      # later merge can never reuse, and overwrite, a version that already has an image.
      - name: Create the tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --target "$SHA" --generate-notes

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
