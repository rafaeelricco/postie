data_sources:
  - id: source_01
    description: Synthetic PostgreSQL event source
    type: postgres
    host: localhost
    port: 5432
    username: postie_source
    password: ${POSTIE_CAPTURE_PASSWORD}
    database: postie
    table: source_events
    columns:
      - id
      - event_id
      - correlation_id
      - sequence_number
      - event_name
      - payload
      - metadata
      - recorded_at
    serialColumn: id
    partitioningColumn: correlation_id

data_destinations:
  - id: destination_01
    description: Synthetic HTTP destination 01
    type: http-push
    endpoint: http://receiver.example.invalid:8080/api/destinations/01
    username: postie_delivery
    password: ${POSTIE_DELIVERY_PASSWORD}
    sources:
      - source_01

  - id: destination_02
    description: Synthetic HTTP destination 02
    type: http-push
    endpoint: http://receiver.example.invalid:8080/api/destinations/02
    username: postie_delivery
    password: ${POSTIE_DELIVERY_PASSWORD}
    sources:
      - source_01
    filter:
      column: event_name
      values:
        - EntityCreated
